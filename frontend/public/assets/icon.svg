<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071e17" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.35" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.15" filter="url(#glow)" />

  <!-- Biotech / Binary Network Rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="12 12" opacity="0.4" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.25" />

  <!-- Stylized Bionet Emblem: Organic Leaf & Binary Nodes -->
  <g transform="translate(136, 126)">
    <!-- Central Bio-Shield Leaf -->
    <path d="M120 10 C180 10 230 70 230 140 C230 210 170 260 120 280 C70 260 10 210 10 140 C10 70 60 10 120 10 Z" fill="url(#leafGrad)" />
    <!-- Leaf Spine & Veins (Binary Nodes) -->
    <path d="M120 40 L120 250" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <path d="M120 90 L170 60" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    <path d="M120 140 L180 110" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    <path d="M120 190 L170 170" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    <path d="M120 110 L65 85" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    <path d="M120 160 L60 140" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    
    <!-- Binary Network Golden Nodes -->
    <circle cx="170" cy="60" r="12" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="180" cy="110" r="14" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="170" cy="170" r="12" fill="url(#goldGrad)" />
    <circle cx="65" cy="85" r="12" fill="url(#goldGrad)" />
    <circle cx="60" cy="140" r="12" fill="url(#goldGrad)" />
    <circle cx="120" cy="40" r="16" fill="#ffffff" />
    <circle cx="120" cy="40" r="8" fill="#059669" />
  </g>

  <!-- Golden Crown / Star of Excellence at Top -->
  <polygon points="256,64 266,88 292,90 272,106 278,132 256,118 234,132 240,106 220,90 246,88" fill="url(#goldGrad)" />
</svg>
