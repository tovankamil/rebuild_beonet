apiVersion: apps/v1
kind: Deployment
metadata:
  name: synetiq-app
  namespace: synetiq
  labels:
    app: synetiq-app
    app.kubernetes.io/name: synetiq-app
    app.kubernetes.io/part-of: synetiq-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: synetiq-app
  template:
    metadata:
      labels:
        app: synetiq-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: ghcr.io/tovankamil/rebuild_beonet:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: synetiq-config
            - secretRef:
                name: synetiq-secret
          volumeMounts:
            - name: app-uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: app-uploads
          hostPath:
            path: /opt/synetiq/uploads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: synetiq-app
  namespace: synetiq
  labels:
    app: synetiq-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app: synetiq-app
---
apiVersion: v1
kind: Service
metadata:
  name: synetiq-app-nodeport
  namespace: synetiq
  labels:
    app: synetiq-app
spec:
  type: NodePort
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
  selector:
    app: synetiq-app

