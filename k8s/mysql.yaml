apiVersion: apps/v1
kind: Deployment
metadata:
  name: synetiq-mysql
  namespace: synetiq
  labels:
    app: synetiq-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: synetiq-mysql
  template:
    metadata:
      labels:
        app: synetiq-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "t0v4n.kamil"
            - name: MYSQL_DATABASE
              value: "bionetv6"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
      volumes:
        - name: mysql-data
          hostPath:
            path: /opt/synetiq/mysql_data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: synetiq-mysql
  namespace: synetiq
  labels:
    app: synetiq-mysql
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: synetiq-mysql

